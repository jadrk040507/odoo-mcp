name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run cf:typegen
      - run: git diff --exit-code -- worker-configuration.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --audit-level=high
      - run: npm run check:secrets
        env:
          ODOO_TEST_SECRET: ODOO_TEST_SECRET_ci_marker_please_redact
      - run: npm run validate:plugin
      - run: npx wrangler deploy --dry-run --env staging
