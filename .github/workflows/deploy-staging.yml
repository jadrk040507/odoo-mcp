name: Deploy staging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
      - run: npx wrangler d1 migrations apply odoo-connect-staging --remote --env staging
        env: &cloudflare
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --env staging
        env: *cloudflare
      - run: curl --fail --silent --show-error "${{ vars.PUBLIC_ORIGIN }}/healthz"
